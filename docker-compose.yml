services:
  fh6-tuner:
    build: .
    image: fh6-tuner
    container_name: fh6-tuner
    ports:
      - "8000:8000"        # web GUI -> http://localhost:8000
      - "5300:5300/udp"    # Forza Data Out telemetry
    volumes:
      - ./sessions:/app/sessions   # persist recorded laps on the host
    command: ["python", "main.py", "gui", "--no-browser"]
    restart: unless-stopped
